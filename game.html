<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Memory Match</title>
    <style>
      :root {
        --bg: #d911e8;
        --panel: #e00bcb;
        --text: #09f133;
        --muted: #6b7280;
        --primary: #4f46e5;
        --primary-dark: #4338ca;
        --success: #34d399;
        --card-back: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
        --card-front: #f8fafc;
        --shadow: 0 18px 35px rgba(79, 70, 229, 0.18);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top, #eff6ff 0%, #eef2ff 35%, #f8fafc 100%);
        font-family: Arial, Helvetica, sans-serif;
        color: var(--text);
      }

      .game {
        width: min(92vw, 640px);
        background: var(--panel);
        border-radius: 24px;
        box-shadow: var(--shadow);
        padding: 24px;
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 14px;
        margin-bottom: 16px;
        flex-wrap: wrap;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 4vw, 2.8rem);
      }

      .button-row {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      button {
        font: inherit;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        transition: transform 0.15s ease, box-shadow 0.15s ease;
      }

      button:hover {
        transform: translateY(-1px);
      }

      .primary-btn {
        background: var(--primary);
        color: white;
        padding: 10px 16px;
        font-weight: 700;
        box-shadow: 0 10px 20px rgba(79, 70, 229, 0.2);
      }

      .primary-btn:hover {
        background: var(--primary-dark);
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
        margin-bottom: 16px;
      }

      .stat {
        background: #f8fafc;
        border: 1px solid #e5e7eb;
        border-radius: 14px;
        padding: 12px;
        text-align: center;
      }

      .label {
        display: block;
        font-size: 0.72rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
      }

      .value {
        display: block;
        margin-top: 6px;
        font-size: 1.4rem;
        font-weight: 700;
      }

      .status {
        min-height: 26px;
        margin-bottom: 18px;
        font-weight: 600;
        color: var(--muted);
      }

      .board {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 12px;
        perspective: 1000px;
      }

      .card {
        position: relative;
        aspect-ratio: 1 / 1;
        background: transparent;
        padding: 0;
        border: none;
        cursor: pointer;
        transform-style: preserve-3d;
        transition: transform 0.45s ease;
      }

      .card:focus-visible {
        outline: 3px solid rgba(79, 70, 229, 0.45);
        outline-offset: 4px;
      }

      .card.flipped {
        transform: rotateY(180deg);
      }

      .card-face {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 16px;
        backface-visibility: hidden;
        font-size: clamp(2rem, 5vw, 3rem);
        box-shadow: 0 8px 18px rgba(15, 23, 42, 0.12);
        user-select: none;
      }

      .card-back {
        background: var(--card-back);
        color: white;
      }

      .card-front {
        background: var(--card-front);
        transform: rotateY(180deg);
      }

      .card.matched .card-front {
        background: var(--success);
      }

      .card.disabled {
        cursor: default;
      }

      @media (max-width: 540px) {
        .game {
          padding: 18px;
          border-radius: 18px;
        }

        .stats {
          grid-template-columns: repeat(3, minmax(80px, 1fr));
        }
      }
    </style>
  </head>
  <body>
    <main class="game">
      <div class="topbar">
        <h1>Memory Match</h1>
        <div class="button-row">
          <button id="restartBtn" class="primary-btn" type="button">New Game</button>
        </div>
      </div>

      <div class="stats">
        <div class="stat">
          <span class="label">Moves</span>
          <span id="moves" class="value">0</span>
        </div>
        <div class="stat">
          <span class="label">Time</span>
          <span id="timer" class="value">0s</span>
        </div>
        <div class="stat">
          <span class="label">Best</span>
          <span id="best" class="value">—</span>
        </div>
      </div>

      <div id="status" class="status">Find all the matching pairs!</div>
      <section id="board" class="board" aria-label="Memory Match Game Board"></section>
    </main>

    <script>
      const board = document.getElementById('board');
      const movesEl = document.getElementById('moves');
      const timerEl = document.getElementById('timer');
      const bestEl = document.getElementById('best');
      const statusEl = document.getElementById('status');
      const restartBtn = document.getElementById('restartBtn');

      const symbols = ['🍉', '🍋', '🍇', '🍓', '🍒', '🍊', '🍍', '🍏'];
      const bestKey = 'memory-match-best';

      let cards = [];
      let firstCard = null;
      let secondCard = null;
      let firstButton = null;
      let secondButton = null;
      let lockBoard = false;
      let moves = 0;
      let matchCount = 0;
      let elapsedSeconds = 0;
      let timerInterval = null;
      let gameStarted = false;

      function loadBestScore() {
        const saved = Number(localStorage.getItem(bestKey));
        bestEl.textContent = Number.isFinite(saved) && saved > 0 ? `${saved}s` : '—';
      }

      function setStatus(message) {
        statusEl.textContent = message;
      }

      function startTimer() {
        if (timerInterval) return;

        timerInterval = setInterval(() => {
          elapsedSeconds += 1;
          timerEl.textContent = `${elapsedSeconds}s`;
        }, 1000);
      }

      function stopTimer() {
        if (timerInterval) {
          clearInterval(timerInterval);
          timerInterval = null;
        }
      }

      function shuffle(items) {
        const copy = [...items];

        for (let i = copy.length - 1; i > 0; i -= 1) {
          const j = Math.floor(Math.random() * (i + 1));
          [copy[i], copy[j]] = [copy[j], copy[i]];
        }

        return copy;
      }

      function buildDeck() {
        const deck = shuffle([...symbols, ...symbols]);
        cards = deck.map((symbol, index) => ({
          id: `${symbol}-${index}-${Math.random().toString(16).slice(2)}`,
          symbol,
          matched: false,
        }));
      }

      function renderBoard() {
        board.innerHTML = '';

        cards.forEach((card) => {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'card';
          button.dataset.id = card.id;
          button.dataset.symbol = card.symbol;
          button.setAttribute('aria-label', 'Hidden card');

          const back = document.createElement('span');
          back.className = 'card-face card-back';
          back.textContent = '?';

          const front = document.createElement('span');
          front.className = 'card-face card-front';
          front.textContent = card.symbol;

          button.append(back, front);
          button.addEventListener('click', () => handleCardClick(button, card));
          board.appendChild(button);
        });
      }

      function updateMoves() {
        movesEl.textContent = String(moves);
      }

      function resetTurn() {
        firstCard = null;
        secondCard = null;
        firstButton = null;
        secondButton = null;
        lockBoard = false;
      }

      function finishGame() {
        stopTimer();

        const currentBest = Number(localStorage.getItem(bestKey));
        if (!Number.isFinite(currentBest) || elapsedSeconds < currentBest) {
          localStorage.setItem(bestKey, String(elapsedSeconds));
          bestEl.textContent = `${elapsedSeconds}s`;
        }

        setStatus(`You won in ${moves} moves and ${elapsedSeconds} seconds!`);
      }

      function handleMatch() {
        firstCard.matched = true;
        secondCard.matched = true;

        firstButton.classList.add('matched', 'disabled');
        secondButton.classList.add('matched', 'disabled');

        matchCount += 1;

        if (matchCount === symbols.length) {
          finishGame();
        } else {
          setStatus('Nice match! Keep going!');
        }

        resetTurn();
      }

      function handleCardClick(button, card) {
        if (lockBoard || button.classList.contains('flipped') || button.classList.contains('matched')) {
          return;
        }

        if (!gameStarted) {
          gameStarted = true;
          startTimer();
        }

        button.classList.add('flipped');
        button.setAttribute('aria-label', `Revealed ${card.symbol}`);

        if (!firstCard) {
          firstCard = card;
          firstButton = button;
          return;
        }

        secondCard = card;
        secondButton = button;
        moves += 1;
        updateMoves();
        lockBoard = true;

        if (firstCard.symbol === secondCard.symbol) {
          setTimeout(handleMatch, 250);
          return;
        }

        setStatus('Not a match. Try again!');
        setTimeout(() => {
          firstButton.classList.remove('flipped');
          secondButton.classList.remove('flipped');
          firstButton.setAttribute('aria-label', 'Hidden card');
          secondButton.setAttribute('aria-label', 'Hidden card');
          resetTurn();
        }, 700);
      }

      function resetGame() {
        stopTimer();
        cards = [];
        firstCard = null;
        secondCard = null;
        firstButton = null;
        secondButton = null;
        lockBoard = false;
        moves = 0;
        matchCount = 0;
        elapsedSeconds = 0;
        gameStarted = false;

        movesEl.textContent = '0';
        timerEl.textContent = '0s';
        setStatus('Find all the matching pairs!');

        buildDeck();
        renderBoard();
      }

      restartBtn.addEventListener('click', resetGame);

      loadBestScore();
      resetGame();
    </script>
  </body>
</html>
